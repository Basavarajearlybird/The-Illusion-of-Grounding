[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gib15k"
version = "1.0.0"
description = "GIB-15K — a diagnostic benchmark for multimodal RAG under retrieval noise, visual ambiguity, and cross-modal conflict"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
keywords = ["benchmark", "multimodal", "rag", "hallucination", "vision-language"]

dependencies = [
    "numpy>=1.24,<2.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "duckdb>=0.10",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.optional-dependencies]
heavy = [
    "torch>=2.2", "transformers>=4.45", "accelerate>=0.30",
    "sentence-transformers>=3.0", "faiss-cpu>=1.8",
    "openai>=1.40", "google-genai>=0.3", "anthropic>=0.40",
]
human = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
gib = "gib.cli:main"

[tool.setuptools.packages.find]
include = ["gib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 line-length is handled by the formatter; B008 fires on argparse defaults;
# B905 (zip strict=) and E702 (semicolons) are used intentionally in a few
# equal-length zips and compact table rows and would add noise, not safety.
ignore = ["E501", "B008", "B905", "E702"]
